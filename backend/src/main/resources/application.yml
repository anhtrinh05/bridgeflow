spring:
  application:
    name: bridgeflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bridgeflow}
    username: ${DB_USERNAME:bridgeflow}
    password: ${DB_PASSWORD:bridgeflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

bridgeflow:
  storage:
    root: ${BRIDGEFLOW_STORAGE_ROOT:${java.io.tmpdir}/bridgeflow-uploads}
    max-bytes: ${BRIDGEFLOW_STORAGE_MAX_BYTES:10485760}
  cors:
    allowed-origins: ${BRIDGEFLOW_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  ai:
    provider: ${BRIDGEFLOW_AI_PROVIDER:disabled}
    max-input-characters: ${BRIDGEFLOW_AI_MAX_INPUT_CHARACTERS:60000}
    max-candidates: ${BRIDGEFLOW_AI_MAX_CANDIDATES:25}
    max-questions: ${BRIDGEFLOW_AI_MAX_QUESTIONS:8}
    max-criteria: ${BRIDGEFLOW_AI_MAX_CRITERIA:12}
    max-test-cases: ${BRIDGEFLOW_AI_MAX_TEST_CASES:20}
    redact-terms: ${BRIDGEFLOW_AI_REDACT_TERMS:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-6-astra}
  retention:
    enabled: ${BRIDGEFLOW_RETENTION_ENABLED:false}
    archived-project-days: ${BRIDGEFLOW_RETENTION_ARCHIVED_PROJECT_DAYS:365}
    cron: ${BRIDGEFLOW_RETENTION_CRON:0 30 2 * * *}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: BridgeFlow bilingual requirements API

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level correlationId=%X{correlationId:-} %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
