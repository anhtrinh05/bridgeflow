spring:
  application:
    name: bridgeflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bridgeflow}
    username: ${DB_USERNAME:bridgeflow}
    password: ${DB_PASSWORD:bridgeflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

bridgeflow:
  storage:
    root: ${BRIDGEFLOW_STORAGE_ROOT:${java.io.tmpdir}/bridgeflow-uploads}
    max-bytes: ${BRIDGEFLOW_STORAGE_MAX_BYTES:10485760}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
