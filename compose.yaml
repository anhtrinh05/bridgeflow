services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bridgeflow
      POSTGRES_USER: bridgeflow
      POSTGRES_PASSWORD: bridgeflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgeflow -d bridgeflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bridgeflow-postgres:/var/lib/postgresql/data

volumes:
  bridgeflow-postgres:
